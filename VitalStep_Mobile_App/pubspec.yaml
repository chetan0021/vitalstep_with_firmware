name: vitalstep_app
description: VitalStep Palm Pressure Monitor - Mobile App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase & Backend
  supabase_flutter: ^2.4.0
  supabase: ^2.0.0
  
  # UI & State Management
  provider: ^6.0.0
  google_fonts: ^6.0.0
  flutter_animate: ^4.2.0
  shimmer: ^3.0.0
  
  # Data & API
  http: ^1.1.0
  dio: ^5.3.0
  json_annotation: ^4.8.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # Charts & Graphs
  fl_chart: ^0.64.0
  syncfusion_flutter_charts: ^23.1.36
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  logger: ^2.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.0
  
  # Utils
  image: ^4.1.0
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
  
  fonts:
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-Regular.ttf
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
